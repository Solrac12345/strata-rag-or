name: CI/CD Pipeline

# EN: Trigger this workflow on every push or Pull Request to main
# FR: Déclencher ce flux de travail à chaque push ou Pull Request vers main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    # 1. Download the code from GitHub
    - uses: actions/checkout@v4

    # 2. Install Python
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3. Install your project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # EN: Install testing and linting tools
        # FR: Installer les outils de test et de linting
        pip install pytest flake8

    # 4. Check code quality (syntax errors & undefined names)
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # 5. Run your tests
    - name: Test with pytest
      run: |
        pytest tests/ -v