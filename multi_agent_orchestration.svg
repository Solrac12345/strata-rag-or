<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="560">
  <defs>
    <marker id="wh" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="white"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1024" height="560" fill="#060c1b"/>

  <!-- Title -->
  <text x="512" y="68" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="36" font-weight="bold" fill="white">
    Multi-Agent Orchestration
  </text>

  <!-- ═══════════════ TOP ROW BOXES ═══════════════ -->

  <!-- B1: User Question -->
  <rect x="52" y="130" width="150" height="72" rx="10"
        fill="#0c1a38" stroke="#1e8fd4" stroke-width="1.8"/>
  <text x="127" y="172" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white">
    User Question
  </text>

  <!-- Arrow 1 -->
  <line x1="204" y1="166" x2="241" y2="166"
        stroke="white" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- B2: Routing Agent -->
  <rect x="245" y="130" width="150" height="72" rx="10"
        fill="#0c1a38" stroke="#1e8fd4" stroke-width="1.8"/>
  <text x="320" y="172" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white">
    Routing Agent
  </text>

  <!-- Arrow 2 -->
  <line x1="397" y1="166" x2="434" y2="166"
        stroke="white" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- B3: QA Agent -->
  <rect x="438" y="130" width="150" height="72" rx="10"
        fill="#0c1a38" stroke="#1e8fd4" stroke-width="1.8"/>
  <text x="513" y="172" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white">
    QA Agent
  </text>

  <!-- Arrow 3 -->
  <line x1="590" y1="166" x2="627" y2="166"
        stroke="white" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- B4: AWS Bedrock -->
  <rect x="631" y="130" width="150" height="72" rx="10"
        fill="#0c1a38" stroke="#1e8fd4" stroke-width="1.8"/>
  <text x="706" y="172" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white">
    AWS Bedrock
  </text>

  <!-- Arrow 4 -->
  <line x1="783" y1="166" x2="820" y2="166"
        stroke="white" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- B5: Answer + Sources -->
  <rect x="824" y="130" width="150" height="72" rx="10"
        fill="#0c1a38" stroke="#1e8fd4" stroke-width="1.8"/>
  <text x="899" y="172" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white">
    Answer + Sources
  </text>

  <!-- ═══════════════ VERTICAL CONNECTING ARROWS ═══════════════ -->

  <!-- Down: QA Agent bottom (513,204) → Embeddings top (495,313) -->
  <line x1="513" y1="204" x2="495" y2="313"
        stroke="white" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- Up: Document Store top (735,313) → AWS Bedrock bottom (706,204) -->
  <line x1="735" y1="313" x2="706" y2="204"
        stroke="white" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- ═══════════════ DASHED RETRIEVAL PIPELINE BOX ═══════════════ -->
  <rect x="430" y="295" width="380" height="130" rx="14"
        fill="none" stroke="white" stroke-width="1.4" stroke-dasharray="7,5"/>

  <!-- Sub-box: Embeddings (center x=495) -->
  <rect x="448" y="315" width="95" height="52" rx="8"
        fill="#0c1a38" stroke="#1e8fd4" stroke-width="1.5"/>
  <text x="495" y="346" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white">
    Embeddings
  </text>

  <!-- Sub-arrow 1 -->
  <line x1="545" y1="341" x2="564" y2="341"
        stroke="white" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- Sub-box: Vector Store (center x=615) -->
  <rect x="568" y="315" width="95" height="52" rx="8"
        fill="#0c1a38" stroke="#1e8fd4" stroke-width="1.5"/>
  <text x="615" y="346" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white">
    Vector Store
  </text>

  <!-- Sub-arrow 2 -->
  <line x1="665" y1="341" x2="684" y2="341"
        stroke="white" stroke-width="1.5" marker-end="url(#wh)"/>

  <!-- Sub-box: Document Store (center x=735) -->
  <rect x="688" y="315" width="95" height="52" rx="8"
        fill="#0c1a38" stroke="#1e8fd4" stroke-width="1.5"/>
  <text x="735" y="338" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white">
    Document
  </text>
  <text x="735" y="354" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white">
    Store
  </text>

  <!-- Pipeline label -->
  <text x="620" y="445" text-anchor="middle"
        font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#8899bb">
    retrieval pipeline
  </text>
</svg>
